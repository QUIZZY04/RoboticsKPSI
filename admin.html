<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | KPSI Robotics</title>
    <style>
        :root { --primary-blue: #003366; --accent-gold: #ffcc00; --light-bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light-bg); padding: 20px; }
        .admin-container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-section { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #eee; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-save { background: var(--primary-blue); color: white; }
        .btn-edit { background: #ff9800; color: white; margin-right: 5px; }
        .btn-delete { background: #f44336; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: var(--primary-blue); color: white; }
        .preview-media { width: 80px; height: 50px; object-fit: cover; border-radius: 4px; }
        #status-msg { display: none; padding: 10px; margin-bottom: 15px; text-align: center; border-radius: 4px; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>Robotic Lab Admin Panel</h1>
    <div id="status-msg"></div>
    <p><a href="index.html">← Back to Site</a> | <button onclick="logoutAdmin()" style="color:red; background:none; border:none; cursor:pointer;">Logout</button></p>

    <div class="form-section">
        <h2 id="form-title">Upload New Activity</h2>
        <input type="hidden" id="edit-id" value="">
        <div class="form-group">
            <label>Select Media (Image or MP4 Video)</label>
            <input type="file" id="file-input" accept="image/*,video/mp4">
        </div>
        <div class="form-group">
            <label>Activity Description</label>
            <textarea id="media-desc" rows="3" placeholder="Describe the activity..."></textarea>
        </div>
        <button class="btn btn-save" onclick="saveActivity()" id="save-btn">Upload Activity</button>
        <button class="btn" onclick="resetForm()" style="background:#ccc; margin-left:10px;">Cancel</button>
    </div>

    <h2>Manage Existing Activities</h2>
    <table>
        <thead><tr><th>Preview</th><th>Description</th><th>Actions</th></tr></thead>
        <tbody id="activity-list"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getDatabase, ref, push, onValue, remove, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBMMwRCiPedXsMN9V9InvFv89OypyPiOHk",
        authDomain: "robotic-af198.firebaseapp.com",
        projectId: "robotic-af198",
        databaseURL: "https://robotic-af198-default-rtdb.firebaseio.com",
        storageBucket: "robotic-af198.appspot.com"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const storage = getStorage(app);

    let currentFile = null;
    let localData = {};
    document.getElementById('file-input').onchange = (e) => currentFile = e.target.files[0];

    onAuthStateChanged(auth, user => { if(!user) window.location.href='index.html'; });

    function showStatus(t, success = true) {
        const m = document.getElementById('status-msg');
        m.innerText = t; m.style.display = 'block';
        m.style.background = success ? '#d4edda' : '#f8d7da';
        setTimeout(() => m.style.display='none', 3000);
    }

    // SYNC LIST
    onValue(ref(db, 'activities'), snapshot => {
        localData = snapshot.val() || {};
        const list = document.getElementById('activity-list');
        list.innerHTML = '';
        Object.keys(localData).reverse().forEach(id => {
            const act = localData[id];
            const preview = act.type === 'video' ? '<b>[VIDEO]</b>' : `<img src="${act.url}" class="preview-media">`;
            list.innerHTML += `<tr>
                <td>${preview}</td>
                <td>${act.description.substring(0,40)}...</td>
                <td>
                    <button class="btn btn-edit" onclick="editActivity('${id}')">Edit</button>
                    <button class="btn btn-delete" onclick="deleteActivity('${id}')">Delete</button>
                </td>
            </tr>`;
        });
    });

    window.saveActivity = async () => {
        const id = document.getElementById('edit-id').value;
        const desc = document.getElementById('media-desc').value;
        if(!desc) return showStatus("Enter description", false);

        try {
            showStatus("Uploading... please wait.");
            let url = id ? localData[id].url : "";
            let type = id ? localData[id].type : "image";

            if(currentFile) {
                type = currentFile.type.includes('video') ? 'video' : 'image';
                const fileRef = sRef(storage, `lab/${Date.now()}_${currentFile.name}`);
                const snap = await uploadBytes(fileRef, currentFile);
                url = await getDownloadURL(snap.ref);
            }

            const payload = { url, description: desc, type, timestamp: Date.now() };
            if(id) await set(ref(db, `activities/${id}`), payload);
            else await push(ref(db, 'activities'), payload);

            resetForm();
            showStatus("Action Successful!");
        } catch (e) { showStatus("Error: " + e.message, false); }
    };

    window.editActivity = (id) => {
        const act = localData[id];
        document.getElementById('edit-id').value = id;
        document.getElementById('media-desc').value = act.description;
        document.getElementById('form-title').innerText = "Edit Activity";
        document.getElementById('save-btn').innerText = "Update Activity";
    };

    window.deleteActivity = async (id) => {
        if(confirm("Delete this activity?")) {
            await remove(ref(db, `activities/${id}`));
            showStatus("Deleted!");
        }
    };

    window.resetForm = () => {
        document.getElementById('edit-id').value = '';
        document.getElementById('media-desc').value = '';
        document.getElementById('file-input').value = '';
        currentFile = null;
        document.getElementById('form-title').innerText = "Upload New Activity";
        document.getElementById('save-btn').innerText = "Upload Activity";
    };

    window.logoutAdmin = () => signOut(auth);
</script>
</body>
</html>
