<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics | Krishna Public School International</title>

    <!-- KEEP YOUR ORIGINAL CSS EXACTLY SAME -->
    <!-- (I DID NOT CHANGE ANY OF YOUR DESIGN CSS) -->
    <style>
        :root {
            --primary-blue: #003366;
            --accent-gold: #ffcc00;
            --light-bg: #f4f7f9;
            --dark-text: #333;
            --white: #ffffff;
            --transition: all 0.3s ease;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        body { font-family:'Segoe UI'; margin:0; background:var(--light-bg);}
        nav { background:var(--primary-blue); color:white; padding:10px 5%; display:flex; justify-content:space-between; align-items:center;}
        nav .logo img{height:55px;margin-right:10px;}
        nav ul{display:flex; list-style:none;}
        nav ul li{margin-left:20px;}
        nav ul li a{color:white;text-decoration:none;}
        .hero{background:#003366;color:white;height:60vh;display:flex;justify-content:center;align-items:center;text-align:center;}
        .container{padding:20px;}
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <div class="logo">
        <img src="images/H.jpeg">
        Robotics & AI Excellence Centre Krishna Public School International
    </div>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="#" onclick="openLoginModal()">Admin Login</a></li>
        <li id="admin-nav-item" style="display:none;"><a href="admin.html">Admin</a></li>
    </ul>
</nav>

<!-- HERO -->
<header class="hero">
    <div>
        <h1>Robotics & AI Excellence</h1>
        <p>Build the Future</p>
    </div>
</header>

<div class="container">
    <h2>Lab Activities</h2>
    <div id="activity-container">Loading...</div>
</div>

<!-- 🔥 COLORFUL LOGIN MODAL -->
<div id="loginModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); backdrop-filter:blur(5px); z-index:9999; justify-content:center; align-items:center;">
  
  <div style="background:linear-gradient(135deg,#003366,#0066cc); padding:30px; border-radius:15px; width:320px; text-align:center; color:white; box-shadow:0 20px 50px rgba(0,0,0,0.5); position:relative;">
    
    <h2>🔐 Admin Login</h2>

    <input type="email" id="adminEmail" placeholder="Email" style="width:100%; padding:10px; margin:10px 0; border-radius:6px; border:none;">
    
    <input type="password" id="adminPassword" placeholder="Password" style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:none;">
    
    <p id="loginError" style="color:#ffdddd;"></p>

    <button onclick="loginAdmin()" style="width:100%; padding:10px; background:#ffcc00; border:none; border-radius:6px; font-weight:bold;">
        Login
    </button>

    <span onclick="closeLoginModal()" style="position:absolute; top:10px; right:15px; cursor:pointer;">✖</span>

  </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMMwRCiPedXsMN9V9InvFv89OypyPiOHk",
  authDomain: "robotic-af198.firebaseapp.com",
  projectId: "robotic-af198",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// MODAL
window.openLoginModal = () => {
  document.getElementById("loginModal").style.display = "flex";
};
window.closeLoginModal = () => {
  document.getElementById("loginModal").style.display = "none";
  document.getElementById("loginError").innerText = "";
};

// LOGIN
window.loginAdmin = async () => {
  const email = document.getElementById("adminEmail").value;
  const password = document.getElementById("adminPassword").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    closeLoginModal();
  } catch (err) {
    document.getElementById("loginError").innerText = err.message;
  }
};

// NAV CONTROL
onAuthStateChanged(auth, (user) => {
  document.getElementById("admin-nav-item").style.display = user ? "block" : "none";
});
</script>

</body>
</html>
