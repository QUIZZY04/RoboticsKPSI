<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics | Krishna Public School International</title>

    <style>
        :root {
            --primary-blue: #003366;
            --accent-gold: #ffcc00;
            --light-bg: #f4f7f9;
            --dark-text: #333;
            --white: #ffffff;
            --transition: all 0.3s ease;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        body { font-family:'Segoe UI'; margin:0; background:var(--light-bg);}
        nav { background:var(--primary-blue); color:white; padding:10px 5%; display:flex; justify-content:space-between; align-items:center;}
        nav .logo img{height:55px;margin-right:10px;}
        nav ul{display:flex; list-style:none;}
        nav ul li{margin-left:20px;}
        nav ul li a{color:white;text-decoration:none;}
        .hero{background:#003366;color:white;height:60vh;display:flex;justify-content:center;align-items:center;text-align:center;}
        .container{padding:20px;}

        /* DYNAMIC ACTIVITY CARDS */
        #activity-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .activity-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); }
        .activity-card img, .activity-card video { width: 100%; height: 200px; object-fit: cover; }
        .activity-card p { padding: 15px; margin: 0; color: #555; }

        /* PROFESSIONAL LOGIN MODAL DESIGN */
        #loginModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); backdrop-filter:blur(8px); z-index:9999; justify-content:center; align-items:center; }
        .modal-box { background: white; padding: 40px; border-radius: 12px; width: 350px; text-align: center; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-box h2 { color: var(--primary-blue); margin-top: 0; }
        .modal-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .modal-box button { width: 100%; padding: 12px; background: var(--primary-blue); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; color: #999; }
    </style>
</head>
<body>

<nav>
    <div class="logo">
        <img src="images/H.jpeg">
        Robotics & AI Excellence Centre Krishna Public School International
    </div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li id="login-nav"><a href="#" onclick="openLoginModal()">Admin Login</a></li>
        <li id="admin-nav-item" style="display:none;"><a href="admin.html">Admin Dashboard</a></li>
    </ul>
</nav>

<header class="hero">
    <div>
        <h1>Robotics & AI Excellence</h1>
        <p>Build the Future at KPSI</p>
    </div>
</header>

<div class="container">
    <h2>Lab Activities</h2>
    <div id="activity-container">Fetching activities...</div>
</div>

<div id="loginModal">
  <div class="modal-box">
    <span class="close-btn" onclick="closeLoginModal()">&times;</span>
    <div style="color: var(--accent-gold); font-size: 40px; margin-bottom: 10px;">🔒</div>
    <h2>Admin Login</h2>
    <input type="email" id="adminEmail" placeholder="Email Address">
    <input type="password" id="adminPassword" placeholder="Password">
    <p id="loginError" style="color: red; font-size: 13px;"></p>
    <button onclick="loginAdmin()">Login to Dashboard</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBMMwRCiPedXsMN9V9InvFv89OypyPiOHk",
  authDomain: "robotic-af198.firebaseapp.com",
  projectId: "robotic-af198",
  databaseURL: "https://robotic-af198-default-rtdb.firebaseio.com" // Ensure this is correct
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

// MODAL CONTROLS
window.openLoginModal = () => document.getElementById("loginModal").style.display = "flex";
window.closeLoginModal = () => {
    document.getElementById("loginModal").style.display = "none";
    document.getElementById("loginError").innerText = "";
};

// LOGIN LOGIC
window.loginAdmin = async () => {
  const email = document.getElementById("adminEmail").value;
  const password = document.getElementById("adminPassword").value;
  try {
    await signInWithEmailAndPassword(auth, email, password);
    closeLoginModal();
  } catch (err) {
    document.getElementById("loginError").innerText = "Invalid credentials.";
  }
};

// AUTH STATE & DYNAMIC CONTENT
onAuthStateChanged(auth, (user) => {
  document.getElementById("admin-nav-item").style.display = user ? "block" : "none";
  document.getElementById("login-nav").style.display = user ? "none" : "block";
});

const activityBox = document.getElementById('activity-container');
onValue(ref(db, 'activities'), (snapshot) => {
    const data = snapshot.val();
    activityBox.innerHTML = '';
    if (data) {
        Object.keys(data).reverse().forEach(id => {
            const item = data[id];
            const media = item.type === 'video' 
                ? `<video controls src="${item.url}"></video>` 
                : `<img src="${item.url}">`;
            activityBox.innerHTML += `<div class="activity-card">${media}<p>${item.description}</p></div>`;
        });
    } else {
        activityBox.innerHTML = '<p>No activities found.</p>';
    }
});
</script>
</body>
</html>
